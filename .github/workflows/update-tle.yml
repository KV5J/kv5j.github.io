name: Update satellite orbit data

on:
  schedule:
    - cron: "17 6 * * *"   # once a day, 06:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download TLEs (AMSAT, then CelesTrak so its newer sets win)
        run: |
          set +e
          mkdir -p tle
          : > tle/new.txt
          curl -fsSL --retry 3 --max-time 60 "https://www.amsat.org/tle/current/nasabare.txt" >> tle/new.txt
          echo >> tle/new.txt
          curl -fsSL --retry 3 --max-time 60 -A "KV5J satellite globe (github.com/KV5J)" \
            "https://celestrak.org/NORAD/elements/gp.php?GROUP=amateur&FORMAT=TLE" >> tle/new.txt
          if grep -q "^1 25544" tle/new.txt; then
            mv tle/new.txt tle/amateur.txt
          else
            echo "No usable data downloaded; keeping the previous file."
            rm -f tle/new.txt
          fi

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tle/amateur.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update TLEs"
            git push
          fi
